; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Das Frontend liegt als Dateien im Ordner data/ und wird getrennt von der Firmware mit
; "pio run -t uploadfs" auf das Gerät geschrieben. Ohne diese Zeile würde PlatformIO daraus
; ein SPIFFS-Abbild bauen, die Firmware hängt das Dateisystem aber als LittleFS ein.
board_build.filesystem = littlefs

; Zwei Dateisysteme: "config" (nur die Konfiguration) und "spiffs" (die Web-UI). Siehe
; partitions.csv. "uploadfs" schreibt nur die UI und laesst die Konfiguration in Ruhe.
board_build.partitions = partitions.csv

; KI generriert:
; build_info.py zaehlt bei jedem Bauen die Build-Nummer hoch (build_number.txt) und legt die
; Kennung dieses Builds ins Image, damit die Firmware sie auch aus der anderen OTA-Partition lesen kann.
;
; build_frontend.py setzt CSS, JavaScript und die Symbole beim Bauen in die jeweilige Seite ein und packt
; alles mit gzip. Grund: Der Webserver bedient eine Verbindung gleichzeitig, und LWIP hat
; nur 16 Kontrollbloecke. Die Quelldateien in data/ bleiben einzeln.
;
; upload_config.py liest die Konfiguration aus der anderen OTA-Partition und schreibt sie in die aktuelle Partition, 
; damit die Firmware beim ersten Start die Konfiguration hat. Danach wird die Konfiguration von der Firmware selbst gepflegt.
; Wird mit "pio run -t uploadconfig" aufgerufen, damit die Konfiguration nicht ueberschrieben wird.
extra_scripts =
    pre:scripts/build_frontend.py
    pre:scripts/build_info.py
    pre:scripts/upload_config.py

monitor_speed = 115200
upload_speed = 921600
 
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024

lib_deps =
    claws/BH1750 @ ^1.3.0
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    sciosense/ScioSense_ENS16x @ ^2.0.5
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ncmreynolds/ld2410 @ ^0.2.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.3
