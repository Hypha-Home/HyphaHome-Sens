<!-- login.html — Anmeldung am Webinterface. Route: GET /login
     Schickt das Passwort an POST /api/login und merkt sich das zurueckgegebene Token.
     Danach geht es weiter zur Startseite. -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- I18N_LOADER: Bei einer anderen Sprache als Deutsch das Woerterbuch vor dem Zeichnen laden
         und den Inhalt bis zum Ersetzen der Texte verbergen. Die Liste der Sprachen steht hier
         und in nichts sonst; eine neue Sprache braucht lang-xx.js und einen Eintrag hier. -->
    <script>(function(){var l='de';try{l=localStorage.getItem('hyphahome-sens.lang')||(navigator.language||'de').slice(0,2).toLowerCase();}catch(e){}
    if(['en'].indexOf(l)>=0){document.documentElement.className+=' i18n-wait';document.write('<script src="'+(location.protocol==='file:'?'':'/')+'js/lang-'+l+'.js"><\/script>');}})();</script>
    <style>.i18n-wait body{visibility:hidden}</style>
    <title data-t="login.title">Hypha Home - Sens &ndash; Anmeldung</title>
    <script>(function(){var t=null;try{t=localStorage.getItem('hyphahome-sens.theme');}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="images/logo-dunkel.svg">
    <link rel="icon" type="image/svg+xml" href="images/logo-hell.svg" media="(prefers-color-scheme: dark)">
</head>
<body class="auth">
    <div class="card">
        <span class="auth-logo"><img class="logo-for-light" src="images/logo-dunkel.svg" alt="Hypha-Home"><img class="logo-for-dark" src="images/logo-hell.svg" alt=""></span>
        <h1 class="auth-title">Hypha Home - Sens</h1>
        <p class="auth-host" id="hostName" hidden></p>
        <p class="sub" data-t="login.sub">Loggen Sie sich ein um Konfigurationen vornehmen zu k&ouml;nnen.</p>

        <div class="msgbox err" id="error" hidden></div>
        <div class="msgbox info" id="hint" hidden></div>

        <form id="loginForm">
            <label for="password" data-t="common.password">Passwort</label>
            <input type="password" id="password" name="pass" autocomplete="current-password" autofocus>
            <button class="btn" type="submit" id="submit" data-t="login.submit">Anmelden</button>
        </form>

        <a class="link" href="./pwreset" data-t="login.forgot">Passwort vergessen?</a>
    </div>

    <script src="js/lang-de.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
    <script>
    (function () {
        'use strict';

        const form     = document.getElementById('loginForm');
        const password = document.getElementById('password');
        const submit   = document.getElementById('submit');
        const error    = document.getElementById('error');
        const hint     = document.getElementById('hint');

        const HOME = '/';

        /* Hostname des Geraets unter dem Titel. /api/info braucht keine Anmeldung. Schlaegt die
         * Abfrage fehl, bleibt die Zeile einfach weg. */
        Api.request('/api/info').then(function (info) {
            if (!info || !info.hostname) return;
            const host = document.getElementById('hostName');
            host.textContent = info.hostname;
            host.hidden = false;
        }).catch(function () {});

        function showError(text) {
            error.textContent = '✗ ' + text;
            error.hidden = false;
        }

        function showHint(text) {
            hint.textContent = text;
            hint.hidden = false;
        }

        /* Beim Laden pruefen, ob eine Anmeldung ueberhaupt noetig ist. Zwei Faelle:
         *   - Das Token aus einer frueheren Sitzung gilt noch -> direkt weiter.
         *   - Das Geraet hat gar kein Passwort (Auslieferungszustand oder nach einem
         *     Passwort-Reset) -> das Formular waere eine sinnlose Huerde. */
        Api.session().then(function (state) {
            if (state.authenticated) {
                window.location.replace(HOME);
                return;
            }
            if (!state.protected) {
                showHint(I18n.t('login.no_password_hint'));
            }
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            error.hidden = true;
            submit.disabled = true;
            submit.textContent = I18n.t('login.signing_in');

            try {
                if (await Api.login(password.value)) {
                    window.location.href = HOME;
                    return;     /* Knopf bleibt gesperrt, die Seite wird ohnehin verlassen. */
                }
                showError(I18n.t('login.wrong_password'));
            } catch (e) {
                /* Kein 401, sondern gar keine Antwort: WLAN weg, Geraet neu gestartet. */
                showError(I18n.t('login.no_connection'));
            }

            submit.disabled = false;
            submit.textContent = I18n.t('login.submit');
            password.value = '';
            password.focus();
        });
    })();
    </script>
</body>
</html>
